# proxychains.conf (VER 4.x) — Fail-Close + Remote DNS for cc-safe
strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000

# Exclude loopback and Tailscale CGNAT (100.64.0.0/10) from SOCKS5 hijack
localnet 127.0.0.0/255.0.0.0
localnet ::1/128
localnet 100.64.0.0/255.192.0.0

[ProxyList]
socks5 127.0.0.1 7891
